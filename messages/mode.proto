edition = "2023";

package cavetalk;

enum Mode {
    MODE_NONE = 0;
    MODE_DISARMED = 1;
    MODE_ARMED_MANUAL = 2;
    MODE_ARMED_AUTO = 3;
}

message SetMode {
    Mode mode = 1 [features.field_presence = IMPLICIT];
}

message GetMode {
    Mode mode = 1 [features.field_presence = IMPLICIT];
}
