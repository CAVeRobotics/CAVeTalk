syntax = "proto3";

package cavetalk;

message Gyroscope {
    optional float roll_radians_per_second = 1;
    optional float pitch_radians_per_second = 2;
    optional float yaw_radians_per_second = 3;
    optional float w = 4;
    optional float x = 5;
    optional float y = 6;
    optional float z = 7;
}
